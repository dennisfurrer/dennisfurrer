<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 256" width="1200" height="256"
     role="img" aria-label="2026 arc: MAR 10 HIP-4 firsts - integration, SDK, frontend; APR 19 axis v0.1 - the first evening; APR 22 globe.li - still the current system; JUN perps.studio - exchange in five minutes; JUL Everex - ingest → backtest → signals; AUG builder.markets - six venues, one book">
  <style>
    .what { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size:19.5px; font-weight:600; letter-spacing:-.2px; fill:#eaeeff }
    .note { font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:11.5px; letter-spacing:1.2px; fill:#5d6a90 }
    .when { font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:11.5px; letter-spacing:2px; fill:#5d8bff }
    .title{ font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:12px; letter-spacing:3.2px; fill:#5d6a90 }
    .line { stroke:#5d8bff; stroke-width:1.5; fill:none; stroke-dasharray:1020;
             stroke-dashoffset:1020; animation:dash 2.2s cubic-bezier(.16,1,.3,1) .35s both }
    .fade-in { animation:fade 1.2s ease .25s both }
    
    @keyframes rise  { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
    @keyframes fade  { from { opacity:0 } to { opacity:1 } }
    @keyframes draw  { from { transform:scaleX(0) } to { transform:scaleX(1) } }
    @keyframes blink { 0%,54% { opacity:1 } 55%,100% { opacity:0 } }
    @keyframes spin  { to { transform:rotate(360deg) } }
    @keyframes drift { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-3px) } }
    @keyframes dash  { to { stroke-dashoffset:0 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important }
      .needs-motion { opacity: 1 !important; transform: none !important }
    }

  </style>

  <rect width="1200" height="256" fill="#04070f"/>
  <rect x="12.5" y="12.5" width="1174.0" height="230.0" fill="none"
