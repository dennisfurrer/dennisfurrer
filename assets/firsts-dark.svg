  <g class="fade-in">
    <text x="44" y="86" class="prok">FEB 25</text>
    <text x="108" y="86" class="pro">a 194-line HIP-4 adapter skeleton lands in the predictions SDK &#8212; written before Hyperliquid</text>
    <text x="108" y="104" class="pro">had published any HIP-4 API at all. Thirteen days before testnet opened.</text>
  </g>
  <path class="line" d="M 100 214 H 1120"/>
<text x="100.0" y="142" text-anchor="middle" class="fg">15:00</text><text x="245.7" y="142" text-anchor="middle" class="fg">16:00</text><text x="391.4" y="142" text-anchor="middle" class="fg">17:00</text><text x="537.1" y="142" text-anchor="middle" class="fg">18:00</text><text x="682.9" y="142" text-anchor="middle" class="fg">19:00</text><text x="828.6" y="142" text-anchor="middle" class="fg">20:00</text><text x="974.3" y="142" text-anchor="middle" class="fg">21:00</text><text x="1120.0" y="142" text-anchor="middle" class="fg">22:00</text>

