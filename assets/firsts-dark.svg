<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" width="1200" height="352"
     role="img" aria-label="March 10 2026: Hyperliquid ships HIP-4 to testnet at 15:32; working integration 17:41; working SDK 18:21; the first HIP-4 builder frontend in the world live at 19:12, three hours forty minutes later; whitelabel market creation 21:43.">
  <style>
    .ft { font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:12.5px; letter-spacing:1.6px; fill:#5d8bff }
    .fl { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size:17px; font-weight:600; letter-spacing:-.2px; fill:#eaeeff }
    .fl.hero { fill:#5fe0ff }
    .fn { font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:10.5px; letter-spacing:.8px; fill:#5d6a90 }
    .fg { font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:9.5px; letter-spacing:1.4px; fill:#1b2440 }
    .fe { font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:11px; letter-spacing:2px; fill:#98a6cf }
    .title{ font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:12px; letter-spacing:3.2px; fill:#5d6a90 }
    .pro { font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:11.5px; letter-spacing:.6px; fill:#98a6cf }
    .prok{ font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:11.5px; letter-spacing:1.6px; fill:#5d8bff }
    .line{ stroke:#1b2440; stroke-width:1.5; fill:none; stroke-dasharray:1020;
            stroke-dashoffset:1020; animation:dash 2s cubic-bezier(.16,1,.3,1) .5s both }
    .fade-in { animation:fade 1.2s ease .25s both }
    
    @keyframes rise  { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
    @keyframes fade  { from { opacity:0 } to { opacity:1 } }
    @keyframes draw  { from { transform:scaleX(0) } to { transform:scaleX(1) } }
    @keyframes blink { 0%,54% { opacity:1 } 55%,100% { opacity:0 } }
    @keyframes spin  { to { transform:rotate(360deg) } }
    @keyframes drift { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-3px) } }
    @keyframes dash  { to { stroke-dashoffset:0 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important }
      .needs-motion { opacity: 1 !important; transform: none !important }
    }

  </style>

  <rect width="1200" height="352" fill="#04070f"/>
  <rect x="12.5" y="12.5" width="1174.0" height="326.0" fill="none"
