<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340"
     role="img" aria-label="Dennis Furrer - founder, CTO. dfurrer.com.">
  <style>
    .name { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size:50px; font-weight:600; letter-spacing:9px; fill:#0c1330 }
    .micro{ font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:12px; letter-spacing:3.4px; fill:#7d8bae }
    .pn   { font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:10px; letter-spacing:.4px; fill:#46557a }
    .rule { fill:#3f6fe2; transform-origin:center; transform-box:fill-box;
             animation:draw 1.15s cubic-bezier(.16,1,.3,1) .5s both }
    .r1   { animation:rise 1s cubic-bezier(.16,1,.3,1) .10s both }
    .fade-in { animation:fade 1.3s ease .25s both }
    .late { animation:fade 1.5s ease .9s both }
    .cur  { animation:blink 1.15s steps(1) 2s infinite both }
    .ping { animation:ping 3.2s ease-out infinite }
    @keyframes ping { 0% { transform:scale(.5); opacity:.6 } 70%,100% { transform:scale(1.5); opacity:0 } }
    
    @keyframes rise  { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
    @keyframes fade  { from { opacity:0 } to { opacity:1 } }
    @keyframes draw  { from { transform:scaleX(0) } to { transform:scaleX(1) } }
    @keyframes blink { 0%,54% { opacity:1 } 55%,100% { opacity:0 } }
    @keyframes spin  { to { transform:rotate(360deg) } }
    @keyframes drift { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-3px) } }
    @keyframes dash  { to { stroke-dashoffset:0 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important }
      .needs-motion { opacity: 1 !important; transform: none !important }
    }

  </style>
