<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Dennis Furrer, dfurrer.com. Founder. CTO. 10+ years in web3.">
  <style>
    .bg     { fill: #FBFBF9; }
    .frame  { fill: none; stroke: #E3E3DE; stroke-width: 1; shape-rendering: crispEdges; }
    .cross  { fill: none; stroke: #CFCFC8; stroke-width: 1; shape-rendering: crispEdges; }
    .name   { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Helvetica, Arial, sans-serif;
              font-size: 46px; font-weight: 600; letter-spacing: 14px; fill: #131316; }
    .cursor { font-weight: 400; }
    .sub    { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
              font-size: 13px; letter-spacing: 5px; fill: #6F6F76; }
    .micro  { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
              font-size: 10px; letter-spacing: 3px; fill: #9C9C96; }
    .rule   { fill: #C9C9C3; transform-origin: center; transform-box: fill-box;
              animation: draw 1.1s cubic-bezier(.77, 0, .18, 1) .45s both; }
    .rise-1 { animation: rise .9s cubic-bezier(.2, .7, .2, 1) .1s both; }
    .rise-2 { animation: rise .9s cubic-bezier(.2, .7, .2, 1) .65s both; }
    .fade   { animation: fade 1.4s ease 1.05s both; }
    .blink  { animation: blink 1.15s steps(1) 1.9s infinite both; }
    @keyframes draw  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 54% { opacity: 1; } 55%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .rule, .rise-1, .rise-2, .fade, .blink { animation: none; }
    }
  </style>

  <rect class="bg" width="1200" height="300"/>
  <rect class="frame" x="16.5" y="16.5" width="1167" height="267"/>

  <g class="cross">
    <path d="M 16.5 8 V 25 M 8 16.5 H 25"/>
    <path d="M 1183.5 8 V 25 M 1175 16.5 H 1192"/>
    <path d="M 16.5 275 V 292 M 8 283.5 H 25"/>
    <path d="M 1183.5 275 V 292 M 1175 283.5 H 1192"/>
  </g>

  <g class="micro fade">
    <text x="44" y="52">10+ YEARS IN WEB3</text>
    <text x="44" y="256">FOUNDER</text>
    <text x="1156" y="256" text-anchor="end">CTO</text>
  </g>

  <text class="name rise-1" x="600" y="148" text-anchor="middle">DENNIS FURRER<tspan class="cursor blink" dx="6">_</tspan></text>
  <rect class="rule" x="512" y="171" width="176" height="1"/>
  <text class="sub rise-2" x="600" y="207" text-anchor="middle">DFURRER.COM</text>
</svg>
