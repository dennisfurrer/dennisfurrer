  <style>
    .big { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Helvetica, Arial, sans-serif; font-size:46px; font-weight:600; letter-spacing:-1px; fill:#eaeeff }
    .lab { font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:12px; letter-spacing:2.6px; fill:#98a6cf }
    .sub { font-family:ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:10.5px; letter-spacing:1.2px; fill:#5d6a90 }
    .fade-in { animation:fade 1.2s ease .3s both }
    
    @keyframes rise  { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
    @keyframes fade  { from { opacity:0 } to { opacity:1 } }
    @keyframes draw  { from { transform:scaleX(0) } to { transform:scaleX(1) } }
    @keyframes blink { 0%,54% { opacity:1 } 55%,100% { opacity:0 } }
    @keyframes spin  { to { transform:rotate(360deg) } }
    @keyframes drift { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-3px) } }
    @keyframes dash  { to { stroke-dashoffset:0 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important }
      .needs-motion { opacity: 1 !important; transform: none !important }
    }

  </style>

